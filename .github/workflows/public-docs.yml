name: Public documentation quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  markdown-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public documentation
        run: python scripts/check_public_docs.py
